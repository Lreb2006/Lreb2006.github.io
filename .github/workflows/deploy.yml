name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set up offline translation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache translation models
        uses: actions/cache@v4
        with:
          path: |
            cache/offline-translation/models
            cache/offline-translation/data/argos-translate/minisbd
          key: offline-models-${{ runner.os }}-${{ hashFiles('scripts/translate-local.py') }}

      - name: Cache generated translations
        uses: actions/cache@v4
        with:
          path: |
            src/data/post-translations
            src/data/dynamic-translations
          key: translations-${{ runner.os }}-${{ github.sha }}
          restore-keys: translations-${{ runner.os }}-

      - name: Render original content for translation
        run: pnpm astro build --outDir cache/translation-source

      - name: Generate updated translations
        run: pnpm translate:post cache/translation-source all --offline --setup

      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
